<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow" />{% endif %}
  {% if page.admin_page %}<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'" />{% endif %}
  <title>{% if page.title and page.title != "首页" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.script %}<script src="{{ page.script | relative_url }}" defer></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="container">
    <header class="site-header">
      <a class="site-brand" href="{{ '/' | relative_url }}">hangdah</a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/docs/' | relative_url }}"{% if page.url contains '/docs/' %} aria-current="page"{% endif %}>文档</a>
        <a href="https://github.com/hangdah" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer>
      &copy; {{ site.time | date: "%Y" }} hangdah · Hosted on GitHub Pages
    </footer>
  </div>
</body>
</html>
